      // --- Utility: Clipboard copy (modern Clipboard API with legacy fallback) ---
      async function copyToClipboard(text, label) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            showToast(label || `Copied ${text}`);
            return;
          } catch (_) {
            // Fall through to execCommand fallback
          }
        }

        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);

          showToast(ok ? (label || `Copied ${text}`) : 'Unable to copy automatically');
        } catch (_) {
          showToast('Unable to copy automatically');
        }

        return `

            <div class="text-muted text-xs uppercase tracking-wider"># engineering philosophy</div>
            <p class="text-ink/90 max-w-[74ch]">
              ${escapeHtml(PROFILE.aboutIntro)}
            </p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-1">
              ${cardsHtml}
            </div>
          </div>
        `;
      }

      function renderProjects() {
        const itemsHtml = PROJECTS.map((project, idx) => {
          const branch = idx === PROJECTS.length - 1 ? '└──' : '├──';
          const linkHtml = project.url
            ? `<a href="${escapeHtml(project.url)}" target="_blank" rel="noopener noreferrer" class="text-xs text-accent hover:underline break-all">${escapeHtml(project.urlLabel)} ↗</a>`
            : '';

          return `
            <div class="pl-3.5 sm:pl-4 relative">
              <span class="absolute -left-[5px] top-2 w-2 h-2 rounded-full ${project.dotClass}"></span>
              <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
                <span class="text-ink font-semibold">${branch} ${escapeHtml(project.name)}</span>
                ${linkHtml}
                <span class="text-xs text-muted">— ${escapeHtml(project.shortSummary)}</span>
              </div>
              <div class="text-xs text-muted mt-1 sm:pl-4 break-words">
                <span class="${project.detailLabelClass}">${escapeHtml(project.detailLabel)}:</span> ${escapeHtml(project.detailText)}
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="space-y-3 text-[13px] sm:text-[13.5px]">
            <div class="text-accent font-medium">~/projects</div>
            <div class="space-y-4 pl-1 border-l border-white/[0.09] ml-1.5">
              ${itemsHtml}
            </div>
          </div>
        `;
      }

      function renderStack() {
        const rowsHtml = STACK.map(
          (group) => `
            <div class="${group.colorClass} font-medium text-xs sm:text-[13.5px]">${escapeHtml(group.terminalLabel || group.category)}</div>
            <div class="text-ink/90 pb-2 sm:pb-0 break-words">${escapeHtml(group.items.join(' · '))}</div>
          `
        ).join('');

        return `
          <div class="space-y-3 text-[13px] sm:text-[13.5px]">
            <div class="text-muted text-xs uppercase tracking-wider"># technical stack</div>
            <div class="grid grid-cols-1 sm:grid-cols-[190px_1fr] gap-y-1 sm:gap-y-2.5 gap-x-4 p-3.5 sm:p-4 rounded-lg bg-white/[0.02] border border-white/[0.06]">
              ${rowsHtml}
            </div>
          </div>
        `;
      }

      function renderContact() {
        return `
          <div class="space-y-3 text-[13px] sm:text-[13.5px]">
            <div class="text-muted text-xs uppercase tracking-wider"># direct channels</div>
            <div class="grid grid-cols-1 sm:grid-cols-[110px_1fr] gap-y-1 sm:gap-y-2 gap-x-4 p-3.5 sm:p-4 rounded-lg bg-white/[0.02] border border-white/[0.06]">
              <div class="text-muted text-xs sm:text-[13.5px]">email</div>
              <div class="flex flex-wrap items-center gap-2 pb-2 sm:pb-0">
                <button
                  type="button"
                  data-copy-email="true"
                  class="text-sage hover:underline cursor-pointer text-left break-all"
                >${escapeHtml(PROFILE.email)}</button>
                <button
                  type="button"
                  data-copy-email="true"
                  class="text-[11px] px-2 py-0.5 rounded bg-white/[0.05] hover:bg-sage/15 text-muted hover:text-sage border border-white/[0.08] transition-colors cursor-pointer"
                >copy</button>
              </div>

              <div class="text-muted text-xs sm:text-[13.5px]">github</div>
              <div class="pb-2 sm:pb-0 break-all">
                <a href="${escapeHtml(PROFILE.githubUrl)}" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline">${escapeHtml(PROFILE.githubHandle)} ↗</a>
              </div>

              <div class="text-muted text-xs sm:text-[13.5px]">linkedin</div>
              <div class="pb-2 sm:pb-0 break-all">
                <a href="${escapeHtml(PROFILE.linkedinUrl)}" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline">${escapeHtml(PROFILE.linkedinHandle)} ↗</a>
              </div>

              <div class="text-muted text-xs sm:text-[13.5px]">x / twitter</div>
              <div class="break-all">
                <a href="${escapeHtml(PROFILE.xUrl)}" target="_blank" rel="noopener noreferrer" class="text-accent hover:underline">${escapeHtml(PROFILE.xHandle)} ↗</a>
              </div>
            </div>
          </div>
        `;
      }

      function renderThemeList() {
        const swatchesHtml = ACCENT_THEMES.map((theme) => {
          const isActive = theme.id === currentThemeId;
          return `
            <button
              type="button"
              data-cmd="theme ${theme.id}"
              class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs transition-colors cursor-pointer ${
                isActive
                  ? 'bg-white/[0.09] border-accent/40 text-ink font-medium'
                  : 'bg-white/[0.03] hover:bg-white/[0.07] border-white/[0.08] text-muted hover:text-ink'
              }"
            >
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${theme.hex}"></span>
              <span>${theme.id}</span>
              ${isActive ? '<span class="text-accent">*</span>' : ''}
            </button>
          `;
        }).join('');

        return `
          <div class="space-y-2.5 text-[13px] sm:text-[13.5px]">
            <div class="text-muted text-xs uppercase tracking-wider"># accent color themes (click or run: theme &lt;name&gt;)</div>
            <div class="flex flex-wrap gap-2">${swatchesHtml}</div>
          </div>
        `;
      }

      function renderHelp() {
        const rows = [
          ['whoami', 'Display profile summary & availability'],
          ['about', 'Engineering philosophy & architectural principles'],
          ['projects', 'Explore selected systems & infrastructure work'],
          ['stack', 'Categorized backend, cloud & DevOps technologies (alias: skills)'],
          ['contact', 'Email (one-click copy), GitHub, LinkedIn & X'],
          ['theme', 'Switch main accent color (e.g. theme emerald)'],
          ['clear', 'Clear terminal output (or press Ctrl+L)'],
        ];

        const itemsHtml = rows
          .map(
            ([cmd, desc]) => `
            <div class="flex flex-col sm:flex-row sm:items-baseline gap-0.5 sm:gap-4">
              <button type="button" data-cmd="${cmd}" class="w-24 text-left text-violet hover:text-accent font-medium cursor-pointer">${cmd}</button>
              <span class="text-muted text-xs sm:text-[13px]">${desc}</span>
            </div>
          `
          )
          .join('');

        return `
          <div class="space-y-2.5 text-[13px] sm:text-[13.5px]">
            <div class="text-muted text-xs uppercase tracking-wider"># available commands (tap or click to run)</div>
            <div class="space-y-2 sm:space-y-1.5 pl-1">${itemsHtml}</div>
            <div class="text-xs text-muted/70 pt-1">
              Tip: Try <span class="text-ink/80">ls</span>, <span class="text-ink/80">cat about.md</span>, <span class="text-ink/80">theme emerald</span>, or switch to <button type="button" data-set-mode="website" class="text-accent hover:underline cursor-pointer">Website</button> mode.
            </div>
          </div>
        `;
      }

      // --- Append a Command + Output Entry to the Terminal ---
      function appendBlock(commandLabel, htmlContent, showPromptHeader = true) {
        const wrapper = document.createElement('div');
        wrapper.className = 'space-y-2.5';

        if (showPromptHeader) {
          const cmdHeader = document.createElement('div');
          cmdHeader.className = 'flex items-center gap-2 text-[13px] sm:text-[13.5px]';
          cmdHeader.innerHTML = `
            <span class="shrink-0 select-none">
              <span class="hidden sm:inline text-sage font-medium">sarhan@cloud</span><span class="hidden sm:inline text-muted">:</span><span class="text-accent font-medium">~</span><span class="text-muted ml-0.5">$</span>
            </span>
            <span class="text-ink font-medium break-all">${escapeHtml(commandLabel)}</span>
          `;
          wrapper.appendChild(cmdHeader);
        }

        const body = document.createElement('div');
        body.innerHTML = htmlContent;
        wrapper.appendChild(body);

        terminalOutput.appendChild(wrapper);
        scrollToBottom();
      }

      // --- Execute a CLI Command ---
      function executeCommand(rawInput) {
        const trimmed = rawInput.trim();
        if (!trimmed) {
          appendBlock('', '', true);
          return;
        }

        if (commandHistory[commandHistory.length - 1] !== trimmed) {
          commandHistory.push(trimmed);
        }
        historyIndex = commandHistory.length;

        const parts = trimmed.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const argStr = parts.slice(1).join(' ');
        const firstArg = (parts[1] || '').toLowerCase();

        switch (cmd) {
          case 'whoami':
            appendBlock(trimmed, renderWhoami());
            break;
          case 'about':
            appendBlock(trimmed, renderAbout());
            break;
          case 'projects':
            appendBlock(trimmed, renderProjects());
            break;
          case 'stack':
          case 'skills':
            appendBlock(trimmed, renderStack());
            break;
          case 'contact':
          case './contact.sh':
            appendBlock(trimmed, renderContact());
            break;
          case 'theme':
            if (!firstArg || firstArg === 'list') {
              appendBlock(trimmed, renderThemeList());
            } else if (setAccentTheme(firstArg, true)) {
              const active = ACCENT_THEMES.find((t) => t.id === firstArg);
              appendBlock(
                trimmed,
                `<div class="text-[13px] sm:text-[13.5px] text-muted flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full inline-block shrink-0" style="background-color: ${active.hex}"></span>
                  <span>Accent theme switched to <span class="text-accent font-medium">${escapeHtml(active.label)}</span>.</span>
                </div>`
              );
            } else {
              appendBlock(
                trimmed,
                `<div class="space-y-2 text-[13px] sm:text-[13.5px]">
                  <div class="text-muted">Unknown theme: <span class="text-ink">${escapeHtml(parts[1])}</span></div>
                  ${renderThemeList()}
                </div>`
              );
            }
            break;
          case 'help':
            appendBlock(trimmed, renderHelp());
            break;
          case 'clear':
            terminalOutput.innerHTML = '';
            appendBlock(
              '',
              `<div class="text-xs text-muted flex flex-wrap items-center gap-2">
                <span>Terminal cleared.</span>
                <button type="button" data-cmd="whoami" class="text-violet hover:text-accent underline decoration-white/15 underline-offset-4 cursor-pointer">whoami</button>
                <span class="text-white/15">·</span>
                <button type="button" data-cmd="projects" class="text-violet hover:text-accent underline decoration-white/15 underline-offset-4 cursor-pointer">projects</button>
                <span class="text-white/15">·</span>
                <button type="button" data-cmd="help" class="text-muted hover:text-ink underline decoration-white/15 underline-offset-4 cursor-pointer">help</button>
              </div>`,
              false
            );
            break;

          case 'ls':
            if (firstArg === 'projects' || firstArg === 'projects/') {
              appendBlock(trimmed, renderProjects());
            } else {
              appendBlock(
                trimmed,
                `<div class="flex flex-wrap gap-x-5 gap-y-1.5 text-[13px] sm:text-[13.5px]">
                  <button type="button" data-cmd="projects" class="text-accent font-medium hover:underline cursor-pointer">projects/</button>
                  <button type="button" data-cmd="stack" class="text-accent font-medium hover:underline cursor-pointer">infrastructure/</button>
                  <button type="button" data-cmd="cat about.md" class="text-ink hover:text-accent cursor-pointer">about.md</button>
                  <button type="button" data-cmd="cat stack.yaml" class="text-ink hover:text-accent cursor-pointer">stack.yaml</button>
                  <button type="button" data-cmd="cat contact.sh" class="text-sage hover:underline cursor-pointer">contact.sh*</button>
                </div>`
              );
            }
            break;
          case 'cat':
            if (!firstArg) {
              appendBlock(trimmed, `<div class="text-[13px] sm:text-[13.5px] text-muted">usage: cat &lt;about.md | stack.yaml | contact.sh&gt;</div>`);
            } else if (firstArg === 'about.md') {
              appendBlock(trimmed, renderAbout());
            } else if (firstArg === 'stack.yaml') {
              appendBlock(trimmed, renderStack());
            } else if (firstArg === 'contact.sh' || firstArg === 'contact.sh*') {
              appendBlock(trimmed, renderContact());
            } else if (firstArg === 'projects' || firstArg === 'projects/') {
              appendBlock(trimmed, `<div class="text-[13px] sm:text-[13.5px] text-muted">cat: projects: Is a directory. Try <button type="button" data-cmd="projects" class="text-violet hover:text-accent underline decoration-white/15 underline-offset-4 cursor-pointer">projects</button>.</div>`);
            } else {
              appendBlock(trimmed, `<div class="text-[13px] sm:text-[13.5px] text-muted">cat: ${escapeHtml(parts[1])}: No such file or directory</div>`);
            }
            break;
          case 'cd':
            if (firstArg === 'projects' || firstArg === 'projects/') {
              appendBlock(trimmed, renderProjects());
            } else if (!firstArg || firstArg === '~' || firstArg === '/home/sarhan') {
              appendBlock(trimmed, `<div class="text-ink/90 text-[13px]">/home/sarhan</div>`);
            } else {
              appendBlock(trimmed, `<div class="text-[13px] sm:text-[13.5px] text-muted">cd: no such file or directory: ${escapeHtml(parts[1])}</div>`);
            }
            break;
          case 'pwd':
            appendBlock(trimmed, `<div class="text-ink/90">/home/sarhan</div>`);
            break;
          case 'uname':
            appendBlock(
              trimmed,
              `<div class="text-ink/90 text-[13px] break-words">Linux sarhan-cloud 6.8.0-gke #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux${argStr ? '' : ' <span class="text-muted">(try uname -a)</span>'}</div>`
            );
            break;
          case 'sudo':
            appendBlock(
              trimmed,
              `<div class="text-amberSoft text-[13px]">sarhan is not in the sudoers file. This incident will be logged to OpenTelemetry.</div>`
            );
            break;
          default:
            appendBlock(
              trimmed,
              `<div class="text-[13px] sm:text-[13.5px] text-muted">
                zsh: command not found: <span class="text-ink">${escapeHtml(cmd)}</span>. Type <button type="button" data-cmd="help" class="text-violet hover:text-accent underline decoration-white/15 underline-offset-4 cursor-pointer">help</button> to see available commands.
              </div>`
            );
            break;
        }
      }

      // --- Ghost Autocomplete Calculation ---
      function updateGhostText() {
        const val = terminalInput.value;
        if (!val || val.includes(' ')) {
          ghostText.textContent = '';
          return;
        }
        const match = AVAILABLE_COMMANDS.find((c) => c.startsWith(val.toLowerCase()));
        if (match && match !== val.toLowerCase()) {
          ghostText.innerHTML = `<span class="opacity-0">${escapeHtml(val)}</span><span>${escapeHtml(match.slice(val.length))}</span>`;
        } else {
          ghostText.textContent = '';
        }
      }

      // --- Auto-type & Execute when clicking a Command Chip ---
      function runCommandAnimated(cmd) {
        if (typingTimer) {
          clearInterval(typingTimer);
          typingTimer = null;
        }

        if (viewTerminalShell.classList.contains('hidden')) {
          setViewMode('terminal');
        }

        terminalInput.value = '';
        ghostText.textContent = '';

        // Avoid forcing soft keyboard open on touch devices when tapping quick chips
        if (window.matchMedia('(pointer: fine)').matches) {
          terminalInput.focus();
        }

        let idx = 0;
        typingTimer = setInterval(() => {
          terminalInput.value += cmd[idx];
          idx += 1;
          updateGhostText();
          if (idx >= cmd.length) {
            clearInterval(typingTimer);
            typingTimer = null;
            setTimeout(() => {
              const finalCmd = terminalInput.value;
              terminalInput.value = '';
              ghostText.textContent = '';
              executeCommand(finalCmd);
            }, 90);
          }
        }, 26);
      }

      // --- View Mode Switcher (Website <-> Full-Viewport Terminal) ---
      function setViewMode(mode) {
        const isTerminal = mode === 'terminal';

        setDockOpen(false);
        viewTerminalShell.classList.toggle('hidden', !isTerminal);
        viewWebsite.classList.toggle('hidden', isTerminal);

        // Position accent dock cleanly above Terminal's pinned bottom command bar
        accentDock.classList.toggle('bottom-[68px]', isTerminal);
        accentDock.classList.toggle('sm:bottom-[72px]', isTerminal);
        accentDock.classList.toggle('bottom-5', !isTerminal);
        accentDock.classList.toggle('sm:bottom-6', !isTerminal);

        // Lock body overflow only in Terminal mode so Website mode scrolls naturally
        document.body.classList.toggle('overflow-hidden', isTerminal);

        document.querySelectorAll('.mode-btn-terminal').forEach((btn) => {
          btn.setAttribute('aria-selected', String(isTerminal));
          btn.classList.toggle('bg-white/[0.1]', isTerminal);
          btn.classList.toggle('text-ink', isTerminal);
          btn.classList.toggle('shadow-sm', isTerminal);
          btn.classList.toggle('text-muted', !isTerminal);
        });

        document.querySelectorAll('.mode-btn-website').forEach((btn) => {
          btn.setAttribute('aria-selected', String(!isTerminal));
          btn.classList.toggle('bg-white/[0.1]', !isTerminal);
          btn.classList.toggle('text-ink', !isTerminal);
          btn.classList.toggle('shadow-sm', !isTerminal);
          btn.classList.toggle('text-muted', isTerminal);
        });

        if (isTerminal) {
          if (window.matchMedia('(pointer: fine)').matches) {
            terminalInput.focus();
          }
          scrollToBottom();
        } else {
          window.scrollTo({ top: 0, behavior: 'instant' });
        }
      }

      // --- Event Listeners ---
      // Delegated clicks for floating accent dock, [data-set-mode], [data-cmd], and [data-copy-email]
      document.addEventListener('click', (e) => {
        const dockToggle = e.target.closest('[data-dock-toggle]');
        if (dockToggle) {
          e.preventDefault();
          setDockOpen(!accentDock.classList.contains('is-open'));
          return;
        }

        const themeChoice = e.target.closest('[data-set-theme]');
        if (themeChoice) {
          e.preventDefault();
          setAccentTheme(themeChoice.getAttribute('data-set-theme'), true);
          setDockOpen(false);
          return;
        }

        if (!e.target.closest('#accent-dock')) {
          setDockOpen(false);
        }

        const modeTrigger = e.target.closest('[data-set-mode]');
        if (modeTrigger) {
          e.preventDefault();
          setViewMode(modeTrigger.getAttribute('data-set-mode'));
          return;
        }

        const cmdTrigger = e.target.closest('[data-cmd]');
        if (cmdTrigger) {
          e.preventDefault();
          runCommandAnimated(cmdTrigger.getAttribute('data-cmd'));
          return;
        }

        const copyTrigger = e.target.closest('[data-copy-email]');
        if (copyTrigger) {
          e.preventDefault();
          copyToClipboard(PROFILE.email, `Copied ${PROFILE.email}`);
          return;
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          setDockOpen(false);
        }
      });

      // Clicking empty area in terminal focuses the input (without breaking text selection)
      terminalScroll.addEventListener('click', (e) => {
        if (window.getSelection().toString().length > 0) return;
        if (e.target.closest('a, button, input')) return;
        terminalInput.focus();
      });

      // Input ghost suggestion update
      terminalInput.addEventListener('input', updateGhostText);

      // Keyboard ergonomics: Enter, Tab, ArrowUp/Down, Ctrl+L
      terminalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const val = terminalInput.value;
          terminalInput.value = '';
          ghostText.textContent = '';
          executeCommand(val);
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const val = terminalInput.value.trim().toLowerCase();
          if (!val) return;
          const match = AVAILABLE_COMMANDS.find((c) => c.startsWith(val));
          if (match) {
            terminalInput.value = match;
            ghostText.textContent = '';
          }
        } else if (e.key === 'ArrowUp') {
          if (commandHistory.length === 0) return;
          e.preventDefault();
          if (historyIndex > 0) historyIndex -= 1;
          terminalInput.value = commandHistory[historyIndex] || '';
          updateGhostText();
        } else if (e.key === 'ArrowDown') {
          if (commandHistory.length === 0) return;
          e.preventDefault();
          if (historyIndex < commandHistory.length - 1) {
            historyIndex += 1;
            terminalInput.value = commandHistory[historyIndex];
          } else {
            historyIndex = commandHistory.length;
            terminalInput.value = '';
          }
          updateGhostText();
        } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
          e.preventDefault();
          executeCommand('clear');
        }
      });

      // --- Initial Boot Sequence ---
      function boot() {
        let initialTheme = 'blue';
        try {
          const saved = localStorage.getItem('sarhan_accent_theme');
          if (saved && ACCENT_THEMES.some((t) => t.id === saved)) {
            initialTheme = saved;
          }
        } catch (_) {}

        renderWebsiteView();
        setAccentTheme(initialTheme, false);
        appendBlock('whoami', renderWhoami(), true);
        setViewMode('website');
      }

      boot();
    })();
  </script>
</body>
